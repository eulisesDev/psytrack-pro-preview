<!-- ==========================================================================
     PSYTRACK PRO v3.0 — build web con Firebase 
     ==========================================================================
     Archivo único. Ábrelo desde https:// o http://localhost.
     Si lo abres con file:// la criptografía y Firebase no funcionarán.

     PARA CONECTARLO A TU PROYECTO:
     1. Sustituye el objeto firebaseConfig de abajo por el de tu proyecto.
     2. En la consola de Firebase habilita:
        · Authentication → método "Correo electrónico/contraseña"
        · Firestore Database → crear base de datos
     3. Pega las reglas de seguridad que están comentadas más abajo.
     4. Agrega tu dominio en Authentication → Settings → Dominios autorizados.

     Mientras firebaseConfig tenga los valores de ejemplo, la app arranca en
     modo local y te lo indica en Ajustes. No se rompe.

     CAMBIOS DE ESTA VERSIÓN respecto de la anterior:
     · Corregido el bucle de escrituras que agotaba la cuota diaria.
     · Corregida la pérdida de pacientes: ya no se escribe el estado semilla
       encima de los datos reales al arrancar.
     · Inicio de sesión más rápido: se lee primero la caché local.
     · Tope propio de 12 000 escrituras al día como red de seguridad.
     ========================================================================== -->

<!-- Tailwind: CDN con JIT, genera las clases con valor arbitrario -->

<style>
  html, body { margin:0; padding:0; background:#0F172A; -webkit-font-smoothing:antialiased; }
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; background:linear-gradient(140deg,#032D60,#0176D3);
          color:#fff; font-family:system-ui,-apple-system,sans-serif; z-index:9999; transition:opacity .3s; }
  #boot h1 { font-size:26px; font-weight:800; letter-spacing:-.02em; margin:14px 0 4px; }
  #boot p  { font-size:13px; opacity:.8; margin:0; }
  #boot .sp { width:26px; height:26px; border:3px solid rgba(255,255,255,.25);
              border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; margin-top:22px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #boot.hide { opacity:0; pointer-events:none; }
  .cloud-pill { position:fixed; top:max(10px, env(safe-area-inset-top)); right:10px;
                z-index:9998; font:600 10.5px system-ui,sans-serif; color:#fff;
                background:rgba(15,23,42,.72); border:1px solid rgba(255,255,255,.12);
                padding:4px 10px; border-radius:99px; display:none; align-items:center; gap:6px;
                box-shadow:0 2px 10px rgba(0,0,0,.15); max-width:65vw; opacity:.92;
                transition:opacity .25s; }
  .cloud-pill.on { display:flex; }
  .cloud-pill .dot { width:7px; height:7px; border-radius:50%; background:#2E844A; }
  .cloud-pill.warn .dot { background:#F59E0B; }
  .cloud-pill.err  .dot { background:#EA001E; }

  /* En un tel\xE9fono real (o una ventana angosta) el marco decorativo de
     "iPhone" (borde, esquinas redondeadas, reloj/wifi falsos) sobra: el
     propio dispositivo ya tiene su barra de estado real. Aqu\xED se apaga
     ese marco para que la app use toda la pantalla sin recortes ni
     encimados, respetando el notch/home indicator. En pantallas anchas
     (escritorio) el marco decorativo se conserva tal cual. */
  @media (max-width: 480px) {
    .psy-app {
      width: 100vw !important; max-width: 100vw !important;
      height: 100vh !important; height: 100dvh !important; max-height: 100dvh !important;
      border-width: 0 !important; border-radius: 0 !important; box-shadow: none !important;
      padding-top: env(safe-area-inset-top) !important;
    }
    .psy-app > div.h-7 { display: none !important; }
    .psy-app .rounded-b-\[2rem\] { border-radius: 0 !important; }
  }

  /* Escritorio: ya NO es un "tel\xE9fono simulado" ni una tarjeta flotante.
     El panel ocupa toda la pantalla real desde el borde del sidebar fijo
     (224px) hasta el borde derecho del navegador, como cualquier app web
     de escritorio normal. Nada de esto se aplica a tablets/m\xF3vil: solo
     pantallas realmente anchas (>=1024px). */
  @media (min-width: 1024px) {
    body { background: #FFFFFF; }
    .psy-app {
      width: calc(100vw - 224px) !important;
      max-width: calc(100vw - 224px) !important;
      height: 100vh !important; height: 100dvh !important;
      max-height: 100vh !important; max-height: 100dvh !important;
      margin-left: 224px !important;
      border-radius: 0 !important; border-width: 0 !important;
      box-shadow: none !important;
    }
    .psy-app > div.h-7 { display: none !important; }
    /* El pill de sincronizaci\xF3n vive fuera de .psy-app (HTML plano); en vez
       de pegarlo al borde real del viewport (donde queda en la franja gris
       vac\xEDa, fuera del panel), se ancla justo a la derecha del sidebar fijo
       de 224px, que siempre est\xE1 dentro del \xE1rea visible. */
    .cloud-pill { left: 234px; right: auto; top: 14px; }
  }

  /* ==========================================================================
     SISTEMA VISUAL "AURORA" — capa de estilo nueva, solo para esta versi\xF3n.
     No cambia ni un solo componente de React: reescribe c\xF3mo se ven las
     clases de Tailwind que la app ya genera, as\xED que funciona en TODAS
     las pantallas sin tocarlas una por una. Se puede desactivar quitando
     este bloque, sin dejar nada roto detr\xE1s.
     ========================================================================== */
  .psy-app, .psy-app input, .psy-app select, .psy-app textarea, .psy-app button {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
  }
  .psy-app { letter-spacing: -.01em; }

  /* Tarjetas: m\xE1s aire, sombra suave en capas, bordes m\xE1s discretos */
  .psy-app .rounded-2xl { border-radius: 1.25rem !important; }
  .psy-app .rounded-xl  { border-radius: 0.9rem !important; }
  .psy-app .border-gray-100 { border-color: #EEF1F7 !important; }
  .psy-app .shadow-sm, .psy-app .shadow {
    box-shadow: 0 1px 2px rgba(3,45,96,.04), 0 10px 24px -14px rgba(3,45,96,.16) !important;
  }
  .psy-app .bg-white.rounded-2xl.border {
    background: linear-gradient(180deg, #ffffff 0%, #FBFCFE 100%) !important;
  }

  /* Botones: degradado propio de marca + microinteracci\xF3n al pasar el mouse */
  .psy-app button.bg-\[\#0176D3\] {
    background: linear-gradient(135deg, #0176D3 0%, #00A3B5 130%) !important;
    box-shadow: 0 6px 16px -6px rgba(1,118,211,.45) !important;
  }
  .psy-app button.bg-\[\#032D60\] {
    background: linear-gradient(135deg, #032D60 0%, #0A4A8F 130%) !important;
  }
  .psy-app button.bg-\[\#2E844A\] {
    background: linear-gradient(135deg, #2E844A 0%, #159465 130%) !important;
  }
  @media (hover: hover) {
    .psy-app button { transition: transform .15s ease, filter .15s ease, box-shadow .15s ease; }
    .psy-app button:not(:disabled):hover { filter: brightness(1.04); transform: translateY(-1px); }
    .psy-app button:not(:disabled):active { transform: translateY(0); filter: brightness(.98); }
  }

  /* Encabezado navy: degradado con m\xE1s profundidad en vez de plano */
  .psy-app .bg-\[\#032D60\] { background: linear-gradient(160deg, #052F63 0%, #032D60 55%, #063a78 100%) !important; }

  /* Barra lateral de escritorio: marca con degradado + separador sutil */
  @media (min-width: 1024px) {
    .psy-app { scrollbar-gutter: stable; }
  }

  /* Scrollbar discreta en escritorio (Firefox + WebKit) */
  .psy-app .cs { scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
  .psy-app .cs::-webkit-scrollbar { width: 6px; height: 6px; }
  .psy-app .cs::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }
  .psy-app .cs::-webkit-scrollbar-track { background: transparent; }

<div class="cloud-pill" id="cloudPill"><span class="dot"></span><span id="cloudTxt">Local</span></div>

<div id="root"></div>

<script>
// ============================================================================
// 1. CONFIGURACIÓN E INICIALIZACIÓN DE FIREBASE
// ============================================================================
// SUSTITUYE ESTOS VALORES POR LOS DE TU PROYECTO.
const firebaseConfig = {
  apiKey:            "AIzaSyAovrwa45kgkjLiN-lcbrNyPmLfWLcA6jI",
  authDomain:        "psytrackv1.firebaseapp.com",
  projectId:         "psytrackv1",
  storageBucket:     "psytrackv1.firebasestorage.app",
  messagingSenderId: "303390018377",
  appId:             "1:303390018377:web:4d0c4845faa236873fe898",
  measurementId:     "G-P1NS5SZQ8E"
};

// Espacio de trabajo: separa los datos por consulta. Si dejas 'auto', usa el
// UID del usuario autenticado, de modo que cada profesional tiene su base.
// Para una clínica con varios terapeutas sobre los mismos pacientes, pon aquí
// un identificador fijo compartido, por ejemplo 'clinica-del-valle'.
const WORKSPACE = 'auto';

// --- Entorno de ejecución -------------------------------------------------
// Firebase Auth valida el origen contra los dominios autorizados y Firestore
// necesita un canal http/https. Al abrir el archivo directamente (file:// en
// escritorio, content:// desde el gestor de archivos de Android) el origen es
// "null": las peticiones no se rechazan, se quedan esperando. Ese es el motivo
// de que el botón gire sin fin y el guardado nunca termine.
const PROTO = location.protocol;
const ORIGIN_OK = PROTO === 'https:' || PROTO === 'http:';
const IS_LOCALHOST = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

const ENV = {
  protocol: PROTO,
  host: location.hostname || '(sin host)',
  originOk: ORIGIN_OK,
  localhost: IS_LOCALHOST,
  reason: ORIGIN_OK ? null
    : PROTO === 'file:' ? 'El archivo se abrió directamente desde el disco (file://).'
    : PROTO === 'content:' ? 'El archivo se abrió desde el gestor de archivos de Android (content://).'
    : `El origen "${PROTO}" no admite conexiones a Firebase.`,
};

const HAS_KEYS = !!firebaseConfig.projectId
  && !String(firebaseConfig.projectId).startsWith('TU-')
  && !!firebaseConfig.apiKey
  && !String(firebaseConfig.apiKey).startsWith('TU_');

// Con claves válidas pero origen inservible, arrancamos en local a propósito:
// intentarlo dejaría la app colgada sin explicación.
const CONFIGURED = HAS_KEYS && ORIGIN_OK;

if (HAS_KEYS && !ORIGIN_OK) {
  console.warn('PsyTrack: ' + ENV.reason + ' Se trabajará en modo local. Publica la app en https:// o ábrela desde localhost para sincronizar.');
}

if (!CONFIGURED) {
  console.warn('PsyTrack: firebaseConfig tiene valores de ejemplo. La app arranca en modo local.');
}
window.PSY_CONFIGURED = CONFIGURED;

let db = null, auth = null, storage = null;

if (CONFIGURED) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();

  // Persistencia offline: la app sigue funcionando sin red y sincroniza al volver.
  db.enablePersistence({ synchronizeTabs: true }).catch(function (err) {
    console.warn('Persistencia offline con restricciones en este navegador:', err && err.code);
  });

  // La sesión sobrevive al cierre del navegador. Cambia a SESSION si prefieres
  // que se cierre al cerrar la pestaña: es más seguro en equipos compartidos.
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function () {});

  // Storage: usado para adjuntos pesados (fotos de consentimiento informado)
  // en vez de embeberlos como texto dentro del documento de Firestore, que
  // tiene un límite duro de 1 MiB por documento (ver DOC_LIMIT más abajo).
  try {
    storage = firebase.storage();
  } catch (err) {
    console.warn('PsyTrack: Firebase Storage no disponible (¿está habilitado en la consola?). Las fotos de consentimiento usarán el modo de respaldo.', err && err.code);
    storage = null;
  }
}
window.PsyStorage = storage;

// ============================================================================
// 2. PUENTE DE DATOS: window.PsyCloud
// ============================================================================
// La app busca este objeto. Si existe y está listo, Repo lee y escribe aquí en
// vez de localStorage. Si no existe, la app funciona en local sin cambios.
//
// Modelo de datos en Firestore:
//   workspaces/{workspaceId}/state/{coleccion}   → { data: [...], updatedAt }
//
// Cada colección de la app (patients, appointments, notes, …) es UN documento.
// Es lo más simple de sincronizar y suficiente para una práctica individual.
// Si superas ~800 pacientes, migra a un documento por registro.
// ============================================================================
(function () {
  // ==========================================================================
  //  MOTOR DE SINCRONIZACIÓN
  //  Reescrito para corregir dos fallas graves de la versión anterior:
  //
  //  A) CONSUMO DESBOCADO DE ESCRITURAS
  //     La app escribía las 17 colecciones en cada cambio, y cada escritura
  //     provocaba un snapshot que la app volvía a escribir: un bucle que
  //     agotaba la cuota diaria en horas. Ahora:
  //       · solo se escribe la colección que realmente cambió (lo decide la app)
  //       · se descartan los snapshots originados por esta misma pestaña
  //         (metadata.hasPendingWrites)
  //       · las escrituras se agrupan cada 4 s, con tope de 15 s de espera
  //       · se comparan los datos antes de escribir: si son idénticos, no se envía
  //       · tope de seguridad diario para no vaciar la cuota gratuita
  //
  //  B) PÉRDIDA DE PACIENTES
  //     Al arrancar, la app cargaba el estado semilla y lo escribía encima de
  //     los datos reales antes de que Firestore respondiera. Ahora ninguna
  //     escritura sale hasta que 'hydrated' confirma la carga inicial.
  // ==========================================================================

  /** Ninguna operación de red puede quedarse esperando indefinidamente.
   *  Sin esto, un origen no autorizado deja la interfaz girando sin mensaje. */
  const conTiempoLimite = (promesa, ms, etiqueta) => Promise.race([
    promesa,
    new Promise((_, rej) => setTimeout(
      () => rej(Object.assign(new Error(`${etiqueta} no respondió en ${Math.round(ms / 1000)} s.`), { code: 'timeout' })),
      ms)),
  ]);
  const T_AUTH = 20000, T_READ = 20000, T_WRITE = 25000;

  const FLUSH_MS      = 4000;    // agrupación de escrituras
  const MAX_WAIT_MS   = 15000;   // nunca esperar más que esto
  const DAILY_BUDGET  = 12000;   // tope propio, por debajo de la cuota gratuita
  const DOC_LIMIT     = 1048576; // límite duro de Firestore: 1 MiB por documento
  const DOC_WARN      = 900000;  // margen de seguridad
  const RETRIES       = 3;

  /** Firestore rechaza `undefined` y no admite arreglos dentro de arreglos.
   *  Un solo campo indefinido hace fallar TODO el lote. */
  function sanitize(v) {
    if (v === undefined) return null;
    if (v === null || typeof v !== 'object') return v;
    if (Array.isArray(v)) return v.map(sanitize);
    const out = {};
    Object.keys(v).forEach(function (k) { if (v[k] !== undefined) out[k] = sanitize(v[k]); });
    return out;
  }

  function byteSize(v) { try { return new Blob([JSON.stringify(v)]).size; } catch (e) { return JSON.stringify(v).length; } }

  const cache   = new Map();  // clave -> valor deserializado
  const shadow  = new Map();  // clave -> JSON de lo último confirmado en la nube
  const dirty   = new Map();  // pendientes de enviar
  const listeners = new Set();

  let unsub = null;
  let pending = null;                 // sesión autenticada en espera de carga
  let uid = null, wsId = null;
  let hydrated = false;
  let flushTimer = null, firstDirtyAt = 0;
  let status = { mode: CONFIGURED ? 'cloud' : 'local', state: 'idle', at: null, writes: 0, error: null };
  let lastError = null;

  // --- Contador de escrituras, persistente por día ---
  function budget() {
    const today = new Date().toISOString().slice(0, 10);
    let b;
    try { b = JSON.parse(localStorage.getItem('psy_write_budget') || 'null'); } catch (e) { b = null; }
    if (!b || b.day !== today) b = { day: today, used: 0 };
    return b;
  }
  function addWrites(n) {
    const b = budget();
    b.used += n;
    try { localStorage.setItem('psy_write_budget', JSON.stringify(b)); } catch (e) {}
    status.writes = b.used;
    return b.used;
  }

  function emit(state) {
    status = { mode: status.mode, state: state || status.state, at: Date.now(), writes: budget().used, error: lastError };
    listeners.forEach(function (fn) { try { fn(status); } catch (e) {} });
    paintPill();
  }

  function paintPill() {
    const pill = document.getElementById('cloudPill');
    const txt  = document.getElementById('cloudTxt');
    if (!pill || !txt) return;
    pill.classList.add('on');
    pill.classList.remove('warn', 'err');
    if (status.mode === 'local') {
      txt.textContent = HAS_KEYS && !ORIGIN_OK ? 'Modo local · ábrela en https:// para sincronizar' : 'Modo local · sin Firebase';
      pill.classList.add('warn'); return;
    }
    if (status.state === 'error')     { txt.textContent = 'Error de conexión'; pill.classList.add('err'); return; }
    if (status.state === 'quota')     { txt.textContent = 'Límite diario alcanzado · solo lectura'; pill.classList.add('err'); return; }
    if (status.state === 'offline')   { txt.textContent = 'Sin conexión · datos locales'; pill.classList.add('warn'); return; }
    if (status.state === 'syncing')   { txt.textContent = 'Guardando…'; pill.classList.add('warn'); return; }
    if (!hydrated)                    { txt.textContent = 'Cargando tu consulta…'; pill.classList.add('warn'); return; }
    txt.textContent = 'Nube · al día (' + budget().used + ' escrituras hoy)';
  }

  function stateCol() { return db.collection('workspaces').doc(wsId).collection('state'); }

  // ------------------------------------------------------------------ envío
  function scheduleFlush() {
    if (!hydrated || dirty.size === 0) return;
    if (!firstDirtyAt) firstDirtyAt = Date.now();
    const waited = Date.now() - firstDirtyAt;
    if (flushTimer) {
      if (waited < MAX_WAIT_MS) return;   // ya hay un envío programado
      clearTimeout(flushTimer); flushTimer = null;
    }
    emit('syncing');
    flushTimer = setTimeout(flush, Math.min(FLUSH_MS, Math.max(0, MAX_WAIT_MS - waited)));
  }

  async function flush() {
    flushTimer = null; firstDirtyAt = 0;
    if (!hydrated || dirty.size === 0) { emit('applied'); return; }

    // Descarta lo que ya está igual en la nube: la causa más común de
    // escrituras inútiles es reguardar un objeto idéntico.
    const pending = [];
    dirty.forEach(function (value, key) {
      const json = value === null ? '\u0000null' : JSON.stringify(value);
      if (shadow.get(key) === json) return;
      pending.push([key, value, json]);
    });
    dirty.clear();
    if (pending.length === 0) { emit('applied'); return; }

    if (budget().used + pending.length > DAILY_BUDGET) {
      console.warn('Tope diario de escrituras alcanzado. Los cambios quedan en este dispositivo.');
      emit('quota');
      return;
    }

    // --- Guardia de tamaño ---------------------------------------------
    // Un documento de Firestore no puede pasar de 1 MiB. Si una colección se
    // excede, el lote COMPLETO falla y ningún cambio se guarda. Antes esto se
    // reportaba como "Error de conexión" y era imposible de diagnosticar.
    const sendable = [];
    pending.forEach(function (e) {
      if (e[1] === null) { sendable.push(e); return; }
      const clean = sanitize(e[1]);
      const size = byteSize(clean);
      if (size > DOC_WARN) {
        const n = Array.isArray(e[1]) ? e[1].length : 1;
        lastError = {
          code: 'doc-too-large', key: e[0], size: size,
          message: 'La colección «' + e[0] + '» pesa ' + Math.round(size / 1024) + ' KB y el límite por documento es 1024 KB. '
                 + 'Casi siempre es por fotos o archivos adjuntos guardados dentro del registro. '
                 + 'Reduce o elimina los adjuntos de esa colección (' + n + ' registro(s)).'
        };
        console.error('PsyTrack:', lastError.message);
        return;   // no intentar: haría fallar todo el lote
      }
      sendable.push([e[0], clean, e[2], size]);
    });

    if (sendable.length === 0) { emit('error'); return; }

    let attempt = 0;
    while (attempt < RETRIES) {
      const batch = db.batch();
      sendable.forEach(function (e) {
        const ref = stateCol().doc(e[0]);
        if (e[1] === null) batch.delete(ref);
        else batch.set(ref, {
          data: e[1],
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: uid || null,
          origin: SESSION_ID
        });
      });
      try {
        await conTiempoLimite(batch.commit(), T_WRITE, 'La escritura en Firestore');
        sendable.forEach(function (e) { shadow.set(e[0], e[2]); });
        addWrites(sendable.length);
        lastError = null;
        emit(pending.length === sendable.length ? 'applied' : 'error');
        return;
      } catch (err) {
        attempt++;
        lastError = {
          code: (err && err.code) || 'desconocido',
          key: sendable.map(function (e) { return e[0]; }).join(', '),
          message: explain(err)
        };
        console.error('PsyTrack · fallo de escritura (intento ' + attempt + '):', err);
        if (attempt >= RETRIES) {
          sendable.forEach(function (e) { if (!dirty.has(e[0])) dirty.set(e[0], e[1]); });
          emit(navigator.onLine ? 'error' : 'offline');
          return;
        }
        await new Promise(function (r) { setTimeout(r, 800 * Math.pow(2, attempt)); });
      }
    }
  }

  /** Traduce el error de Firestore a algo accionable. */
  function explain(err) {
    const c = err && err.code;

  // -------------------------------------------------- carga inicial
  async function bootstrap(user) {
    if (wsId && uid === user.uid && hydrated) return;   // ya cargado
    uid = user.uid;
    wsId = WORKSPACE === 'auto' ? user.uid : WORKSPACE;
    cache.clear(); shadow.clear(); dirty.clear();
    hydrated = false;
    emit('syncing');
    try {
      // Lectura desde caché local primero: la app aparece de inmediato aunque
      // la red esté lenta. Antes se esperaba siempre al servidor y el inicio
      // de sesión tardaba mucho.
      let snap;
      try { snap = await conTiempoLimite(stateCol().get({ source: 'cache' }), 6000, 'La caché local'); } catch (e) { snap = null; }
      if (!snap || snap.empty) snap = await conTiempoLimite(stateCol().get(), T_READ, 'La lectura de Firestore');
      snap.forEach(function (doc) {
        const d = doc.data() || {};
        cache.set(doc.id, d.data);
        shadow.set(doc.id, JSON.stringify(d.data));
      });
      hydrated = true;
      emit('hydrated');
      listen();
      // Refresca contra el servidor sin bloquear la interfaz
      stateCol().get().catch(function () {});

      console.error('No se pudo cargar el espacio de trabajo:', err);
      hydrated = false;
      emit('error');
    }

  function teardown() {
    if (unsub) { try { unsub(); } catch (e) {} unsub = null; }

    configured: function () { return CONFIGURED; },
    env: function () { return { ...ENV, hasKeys: HAS_KEYS }; },
    ready: function () { return hydrated; },
    status: function () { return status; },

    has:  function (key) { return cache.has(key); },
    read: function (key, fallback) {
      const v = cache.get(key);
      return (v === undefined || v === null) ? fallback : v;
    },

      if (Array.isArray(previo) && Array.isArray(value) && previo.length > 0) {

            return lapidas[r.id] != null || nuevasLapidas[r.id] != null;
          });

            const sinJustificar = perdidos.length - justificados.length;
            lastError = {
              code: 'borrado-bloqueado', key: key,
              message: 'Se bloqueó una escritura que habría eliminado ' + sinJustificar + ' registro(s) de «' + key +

                       'Usa el botón de sincronización para revisar la comparación.'

      dirty.set(key, value);

    keys: function () { return Array.from(cache.keys()); },
    flushNow: flush,
    lastError: function () { return lastError; },

    /** Radiografía del estado real: qué hay en la nube, cuánto pesa y qué falló. */
    diagnostics: function () {
      const rows = [];
      cache.forEach(function (v, k) {
        rows.push({
          key: k,
          count: Array.isArray(v) ? v.length : (v === null ? 0 : 1),
          bytes: byteSize(v === undefined ? null : v),
          pending: dirty.has(k),
          tooBig: byteSize(v === undefined ? null : v) > DOC_WARN
        });
      });
      rows.sort(function (a, b) { return b.bytes - a.bytes; });
      return {
        env: ENV, hasKeys: HAS_KEYS,
        configured: CONFIGURED, hydrated: hydrated, uid: uid, workspace: wsId,
        project: firebaseConfig.projectId, session: SESSION_ID,
        pending: Array.from(dirty.keys()), writesToday: budget().used,

    forcePush: async function (payload) {

      Object.keys(payload || {}).forEach(function (k) {

        dirty.set(k, payload[k]);
        shadow.delete(k);
      });
      await flush();
      return lastError;
    },

    /** Descarta la caché y vuelve a leer del servidor. */
    reload: async function () {
      if (!wsId) throw new Error('Sin sesión activa.');
      emit('syncing');
      const snap = await conTiempoLimite(stateCol().get({ source: 'server' }), T_READ, 'La lectura del servidor');
      cache.clear(); shadow.clear();
      snap.forEach(function (doc) {
        const d = doc.data() || {};
        cache.set(doc.id, d.data);

    /* Autentica y NADA MÁS. La carga del espacio de trabajo la dispara la app

       hidrataba aquí dentro: la fusión corría con el ámbito anterior todavía
       activo y mezclaba datos que no correspondían a esa cuenta. */

      const cred = await conTiempoLimite(auth.signInWithEmailAndPassword(email, password), T_AUTH, 'El inicio de sesión');
      const u = cred.user;
      pending = u;
      return { uid: u.uid, email: u.email, displayName: u.displayName, emailVerified: u.emailVerified };
    },

      if (name) { try { await u.updateProfile({ displayName: name }); } catch (e) {} }

       antes de que un usuario real pueda completar el popup. */

      const cred = await conTiempoLimite(auth.signInWithPopup(provider), T_AUTH, 'El inicio de sesión con Google');
      const u = cred.user;
      pending = u;
      return { uid: u.uid, email: u.email, displayName: u.displayName, emailVerified: u.emailVerified };
    },
    signInWithMicrosoft: async function () {
      const provider = new firebase.auth.OAuthProvider('microsoft.com');
      const cred = await conTiempoLimite(auth.signInWithPopup(provider), T_AUTH, 'El inicio de sesión con Microsoft');
      const u = cred.user;
      pending = u;
      return { uid: u.uid, email: u.email, displayName: u.displayName, emailVerified: u.emailVerified };
    },

       Storage en vez de embeberlo como texto dentro del documento de Firestore

      if (!storage || !wsId) return null;
      const ref = storage.ref().child('workspaces/' + wsId + '/' + path);
      await conTiempoLimite(ref.put(blob), T_READ, 'La subida del archivo');
      return await ref.getDownloadURL();

    storageAvailable: function () { return !!storage; },

    'auth/invalid-email': 'El correo no tiene un formato válido.',
    'auth/user-disabled': 'Esta cuenta está deshabilitada.',
    'auth/user-not-found': 'Correo o contraseña incorrectos.',
    'auth/wrong-password': 'Correo o contraseña incorrectos.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese correo.',
    'auth/weak-password': 'La contraseña es demasiado débil.',
    'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.',
    'auth/network-request-failed': 'Sin conexión. Revisa tu red.',
    'auth/operation-not-allowed': 'Habilita el acceso por correo y contraseña en la consola de Firebase.',
    'permission-denied': 'Las reglas de Firestore no permiten esta operación.',
    'unavailable': 'Firestore no está disponible. Trabajando con datos locales.',
    'timeout': 'El servidor no respondió. Si abriste el archivo desde el disco, publícalo en https:// o ábrelo desde localhost.',

      else { pending = null; teardown(); emit('idle'); }

  window.addEventListener('offline', function () { emit('offline'); });

// Mensaje del splash según el modo
document.getElementById('bootMsg').textContent =
  CONFIGURED ? 'Conectando con tu base de datos…'
  : HAS_KEYS ? 'Modo local · el archivo debe abrirse desde https:// o localhost'
  : 'Modo local · configura Firebase para sincronizar';

Manifiesto que he sido informado/a de forma clara y comprensible sobre:

1. NATURALEZA Y OBJETIVOS. El tratamiento psicol\xF3gico consiste en un proceso de evaluaci\xF3n e intervenci\xF3n basado en evidencia, cuyo objetivo es atender el motivo de consulta acordado.
2. PROCEDIMIENTOS. Podr\xE1n emplearse entrevista cl\xEDnica, instrumentos psicom\xE9tricos, t\xE9cnicas cognitivo-conductuales, de tercera generaci\xF3n y tareas entre sesiones.
3. BENEFICIOS Y RIESGOS. El tratamiento puede reducir el malestar y mejorar el funcionamiento. Puede generar malestar emocional transitorio al abordar contenidos dif\xEDciles. No se garantizan resultados espec\xEDficos.
4. VOLUNTARIEDAD. Mi participaci\xF3n es libre y puedo revocar este consentimiento en cualquier momento, sin represalias y sin afectar la atenci\xF3n recibida.
5. CONFIDENCIALIDAD Y SUS L\xCDMITES. La informaci\xF3n es confidencial. Se romper\xE1 la confidencialidad \xFAnicamente cuando exista riesgo grave e inminente para mi vida o la de terceros, sospecha de maltrato a menores o personas vulnerables, o por requerimiento de autoridad judicial competente.
6. EXPEDIENTE. Se integrar\xE1 un expediente cl\xEDnico conforme a la NOM-004-SSA3-2012, resguardado por el tiempo que marca la normativa.
7. HONORARIOS Y CANCELACIONES. Conozco el costo por sesi\xF3n y la pol\xEDtica de cancelaci\xF3n con al menos 24 horas de anticipaci\xF3n.
8. DATOS PERSONALES. El tratamiento de mis datos personales sensibles se rige por el Aviso de Privacidad que se me ha puesto a disposici\xF3n (LFPDPPP).

Declaro que se resolvieron mis dudas y otorgo mi consentimiento libre e informado.`},tele:{id:"tele",name:"Consentimiento de teleterapia",version:"2.0",body:`CONSENTIMIENTO PARA ATENCI\xD3N PSICOL\xD3GICA A DISTANCIA (TELETERAPIA)

1. MODALIDAD. Las sesiones se realizar\xE1n por videollamada cifrada. La teleterapia tiene eficacia comparable a la presencial para diversos cuadros, aunque no es adecuada para todas las situaciones cl\xEDnicas.
2. LIMITACIONES TECNOL\xD3GICAS. Pueden ocurrir fallas de conexi\xF3n, cortes o p\xE9rdida de calidad. Se acuerda un canal alterno de contacto ante interrupciones.
3. PRIVACIDAD DEL ENTORNO. Me comprometo a conectarme desde un espacio privado, con auriculares, y a no grabar la sesi\xF3n sin autorizaci\xF3n expresa por escrito.
4. UBICACI\xD3N Y EMERGENCIAS. Proporcionar\xE9 mi ubicaci\xF3n f\xEDsica al inicio de cada sesi\xF3n y un contacto de emergencia local, para permitir la activaci\xF3n de servicios de auxilio si fuera necesario.
5. JURISDICCI\xD3N. La atenci\xF3n se presta conforme a la normativa aplicable en la entidad donde el profesional est\xE1 habilitado.
6. NO ES SERVICIO DE URGENCIAS. La teleterapia no sustituye la atenci\xF3n de urgencia. Ante crisis debo acudir al servicio de emergencias o l\xEDneas de crisis.`},minors:{id:"minors",name:"Consentimiento para menores de edad",version:"2.0",body:`CONSENTIMIENTO INFORMADO PARA ATENCI\xD3N DE PERSONA MENOR DE EDAD

En mi car\xE1cter de madre, padre o tutor/a legal, otorgo consentimiento para la atenci\xF3n psicol\xF3gica del/la menor identificado/a en este documento, y manifiesto que:

1. He sido informado/a del enfoque, procedimientos, duraci\xF3n estimada y honorarios.
2. Comprendo que el/la menor tiene derecho a un espacio terap\xE9utico con un grado de privacidad apropiado a su edad y desarrollo, y que se me informar\xE1n los aspectos relevantes para su cuidado, sin necesidad de revelar cada contenido de sesi\xF3n.
3. Se romper\xE1 la confidencialidad ante riesgo para la integridad del/la menor o de terceros, o sospecha de maltrato, conforme a la Ley General de los Derechos de Ni\xF1as, Ni\xF1os y Adolescentes.
4. Me comprometo a participar en las sesiones de orientaci\xF3n parental que el proceso requiera.
5. En caso de custodia compartida o litigio, declaro contar con facultades legales para autorizar este tratamiento.`},privacy:{id:"privacy",name:"Aviso de privacidad (LFPDPPP)",version:"3.0",body:`AVISO DE PRIVACIDAD INTEGRAL

RESPONSABLE. El/la profesional de la salud mental que suscribe es responsable del tratamiento de sus datos personales.

DATOS RECABADOS. Identificaci\xF3n y contacto; datos personales sensibles relativos a estado de salud f\xEDsica y mental, historia cl\xEDnica, resultados de instrumentos psicom\xE9tricos y notas de evoluci\xF3n.

FINALIDADES PRIMARIAS. Integrar el expediente cl\xEDnico, brindar atenci\xF3n psicol\xF3gica, dar seguimiento, agendar citas, emitir comprobantes y cumplir obligaciones legales y sanitarias.

FINALIDADES SECUNDARIAS. Env\xEDo de recordatorios, material psicoeducativo y encuestas de satisfacci\xF3n. Puede manifestar su negativa a estas finalidades sin que ello afecte la atenci\xF3n.

TRANSFERENCIAS. No se transfieren datos a terceros sin su consentimiento, salvo las excepciones del art\xEDculo 37 de la LFPDPPP y requerimientos de autoridad competente.

DERECHOS ARCO. Puede ejercer sus derechos de Acceso, Rectificaci\xF3n, Cancelaci\xF3n y Oposici\xF3n, as\xED como revocar su consentimiento, mediante solicitud al medio de contacto proporcionado. Se dar\xE1 respuesta en un plazo m\xE1ximo de 20 d\xEDas h\xE1biles.

MEDIDAS DE SEGURIDAD. Se aplican medidas administrativas, t\xE9cnicas y f\xEDsicas para proteger sus datos, incluyendo cifrado y control de acceso.

CONSERVACI\xD3N. El expediente se conserva al menos 5 a\xF1os a partir del \xFAltimo acto m\xE9dico, conforme a la NOM-004-SSA3-2012.`},recording:{id:"recording",name:"Autorizaci\xF3n de grabaci\xF3n",version:"1.0",body:`AUTORIZACI\xD3N PARA GRABACI\xD3N CON FINES CL\xCDNICOS Y DE SUPERVISI\xD3N

Autorizo la grabaci\xF3n de audio y/o video de mis sesiones exclusivamente para:
1. Revisi\xF3n del propio profesional para mejorar la calidad de la intervenci\xF3n.
2. Supervisi\xF3n cl\xEDnica con un/a supervisor/a tambi\xE9n obligado/a al secreto profesional.

Se me informa que: las grabaciones se almacenan cifradas; no se difundir\xE1n con fines docentes, publicitarios ni de investigaci\xF3n sin un consentimiento adicional y espec\xEDfico; se eliminar\xE1n en un plazo m\xE1ximo de 12 meses o antes si lo solicito; puedo revocar esta autorizaci\xF3n en cualquier momento sin consecuencia alguna.`}},lu=[{id:1,name:"SAPTEL \u2014 L\xEDnea de crisis",cat:"Crisis",desc:"Intervenci\xF3n en crisis y apoyo psicol\xF3gico \xB7 24/7",phone:"55 5259 8121",icon:"\u{1F198}"},{id:2,name:"L\xEDnea de la Vida (CONADIC)",cat:"Crisis",desc:"Adicciones y salud mental \xB7 24/7",phone:"800 911 2000",icon:"\u{1F49A}"},{id:3,name:"Locatel CDMX \u2014 Apoyo emocional",cat:"Crisis",desc:"Orientaci\xF3n psicol\xF3gica \xB7 24/7",phone:"55 5658 1111",icon:"\u{1F4DE}"},{id:4,name:"INMUJERES \u2014 Vida sin violencia",cat:"Mujeres",desc:"Violencia de g\xE9nero \xB7 24/7",phone:"800 911 2511",icon:"\u{1F469}"},{id:5,name:"CNDH \u2014 Derechos humanos",cat:"Legal",desc:"Quejas y orientaci\xF3n \xB7 Lun-Vie 9:00-18:00",phone:"800 715 2000",icon:"\u2696\uFE0F"},{id:6,name:"INP Ram\xF3n de la Fuente",cat:"Psiquiatr\xEDa",desc:"Instituto Nacional de Psiquiatr\xEDa",phone:"55 4160 5000",icon:"\u{1F3E5}"},{id:7,name:"Hospital Psiqui\xE1trico Fray Bernardino",cat:"Psiquiatr\xEDa",desc:"Urgencias psiqui\xE1tricas \xB7 24/7",phone:"55 5061 7500",icon:"\u{1F3E5}"},{id:8,name:"SIPINNA \u2014 Protecci\xF3n a la ni\xF1ez",cat:"Ni\xF1ez",desc:"Denuncia de maltrato infantil",phone:"800 552 2223",icon:"\u{1F9D2}"},{id:9,name:"Emergencias",cat:"Crisis",desc:"N\xFAmero nacional de emergencias",phone:"911",icon:"\u{1F6A8}"},{id:10,name:"CONAPRED",cat:"Legal",desc:"Discriminaci\xF3n \xB7 Lun-Vie",phone:"800 543 0033",icon:"\u{1F91D}"}],pu=[{id:1,title:"\xBFQu\xE9 es el trastorno de ansiedad generalizada?",cat:"Ansiedad",desc:"S\xEDntomas, causas y tratamientos con respaldo emp\xEDrico.",time:"5 min",color:"#00A3B5",content:`El Trastorno de Ansiedad Generalizada (TAG) es una condici\xF3n cr\xF3nica caracterizada por preocupaci\xF3n excesiva, dif\xEDcil de controlar, presente la mayor\xEDa de los d\xEDas durante al menos seis meses.

S\xCDNTOMAS PRINCIPALES
\u2022 Inquietud o sensaci\xF3n de estar "al l\xEDmite".
\u2022 Fatiga f\xE1cil.
\u2022 Dificultad de concentraci\xF3n o mente en blanco.
\u2022 Irritabilidad.
\u2022 Tensi\xF3n muscular.
\u2022 Alteraci\xF3n del sue\xF1o.

MODELO EXPLICATIVO
La evidencia apunta a un modelo de intolerancia a la incertidumbre: la preocupaci\xF3n funciona como estrategia de evitaci\xF3n cognitiva que reduce el malestar a corto plazo y lo mantiene a largo plazo.

TRATAMIENTO DE PRIMERA L\xCDNEA
1. TCC con reestructuraci\xF3n cognitiva, exposici\xF3n a la incertidumbre y entrenamiento en relajaci\xF3n aplicada.
2. Terapias de tercera generaci\xF3n (ACT, MBCT) con evidencia creciente.
3. ISRS/IRSN cuando hay severidad moderada a alta, valorado por psiquiatr\xEDa.

MEDICI\xD3N DE PROGRESO
El GAD-7 permite seguimiento sesi\xF3n a sesi\xF3n. Una reducci\xF3n de 4 puntos o m\xE1s se considera cambio cl\xEDnicamente significativo.`},{id:2,title:"Manejo del estr\xE9s laboral y burnout",cat:"Estr\xE9s",desc:"Del estr\xE9s agotador al s\xEDndrome de desgaste profesional.",time:"7 min",color:"#F59E0B",content:`El burnout (CIE-11 QD85) es un fen\xF3meno ocupacional con tres dimensiones: agotamiento, distanciamiento mental del trabajo y reducci\xF3n de la eficacia profesional.

DISTINGUIR ESTR\xC9S DE BURNOUT
El estr\xE9s implica hiperactivaci\xF3n; el burnout implica desactivaci\xF3n y desconexi\xF3n. Confundirlos lleva a intervenciones err\xF3neas.

ESTRATEGIAS CON EVIDENCIA
1. Intervenci\xF3n organizacional: control sobre la tarea, claridad de rol, carga sostenible. Es la de mayor efecto.
2. Recuperaci\xF3n psicol\xF3gica: desconexi\xF3n mental fuera del horario, no solo tiempo libre.
3. L\xEDmites digitales expl\xEDcitos y negociados con el equipo.
4. Reestructuraci\xF3n de creencias de perfeccionismo y autoexigencia.

SE\xD1ALES DE ALARMA CL\xCDNICA
Insomnio persistente, anhedonia, ideaci\xF3n de escape o s\xEDntomas som\xE1ticos sostenidos requieren evaluaci\xF3n completa: el burnout con frecuencia coexiste con episodios depresivos.`},{id:3,title:"Identificando s\xEDntomas depresivos",cat:"Depresi\xF3n",desc:"Criterios, cribado y cu\xE1ndo derivar.",time:"8 min",color:"#EA001E",content:`La depresi\xF3n cl\xEDnica es un trastorno del estado de \xE1nimo que afecta c\xF3mo la persona siente, piensa y funciona.

CRITERIOS (DSM-5-TR)
Cinco o m\xE1s s\xEDntomas durante dos semanas, incluyendo al menos \xE1nimo deprimido o anhedonia:
\u2022 \xC1nimo deprimido la mayor parte del d\xEDa.
\u2022 P\xE9rdida marcada de inter\xE9s o placer.
\u2022 Cambio significativo de peso o apetito.
\u2022 Insomnio o hipersomnia.
\u2022 Agitaci\xF3n o enlentecimiento psicomotor.
\u2022 Fatiga o p\xE9rdida de energ\xEDa.
\u2022 Sentimientos de inutilidad o culpa excesiva.
\u2022 Disminuci\xF3n de la capacidad de concentraci\xF3n.
\u2022 Pensamientos recurrentes de muerte.

CRIBADO
PHQ-9 es el instrumento de referencia. Un puntaje \u226510 tiene sensibilidad y especificidad cercanas al 88% para depresi\xF3n mayor.

DERIVACI\xD3N URGENTE
Ideaci\xF3n suicida con plan o intenci\xF3n, s\xEDntomas psic\xF3ticos, deterioro funcional grave o riesgo por desnutrici\xF3n requieren valoraci\xF3n psiqui\xE1trica inmediata.`},{id:4,title:"Protocolo de evaluaci\xF3n de riesgo suicida",cat:"Riesgo",desc:"Gu\xEDa pr\xE1ctica para la consulta.",time:"10 min",color:"#8B5CF6",content:`La evaluaci\xF3n del riesgo suicida es una competencia central y debe documentarse en cada contacto donde exista sospecha.

DIMENSIONES A EXPLORAR
1. Ideaci\xF3n: frecuencia, intensidad, duraci\xF3n, capacidad de control.
2. Intenci\xF3n: deseo de morir versus deseo de que el dolor termine.
3. Planificaci\xF3n: nivel de especificidad y preparativos.
4. Factores de riesgo: intentos previos (el predictor m\xE1s potente), desesperanza, aislamiento, consumo de sustancias, dolor cr\xF3nico, p\xE9rdidas recientes.
5. Factores protectores: v\xEDnculos significativos, responsabilidades de cuidado, razones para vivir, alianza terap\xE9utica.

QU\xC9 HACER
\u2022 Preguntar directamente. Preguntar no incrementa el riesgo; es la evidencia m\xE1s replicada del campo.
\u2022 Elaborar un plan de seguridad colaborativo (modelo Stanley-Brown).
\u2022 Reducir el acceso a medios letales involucrando a la red de apoyo.
\u2022 Acordar contacto de seguimiento en 24-72 horas.
\u2022 Documentar el razonamiento cl\xEDnico, no solo la conclusi\xF3n.

DERIVACI\xD3N
Riesgo alto con intenci\xF3n y plan requiere valoraci\xF3n presencial urgente y activaci\xF3n de servicios de emergencia.`},{id:5,title:"Alianza terap\xE9utica y adherencia",cat:"Pr\xE1ctica",desc:"El predictor m\xE1s robusto de resultado.",time:"6 min",color:"#2E844A",content:`La alianza terap\xE9utica explica una porci\xF3n consistente de la varianza del resultado, por encima de la t\xE9cnica espec\xEDfica.

TRES COMPONENTES (Bordin)
1. V\xEDnculo afectivo.
2. Acuerdo sobre las metas.
3. Acuerdo sobre las tareas.

RUPTURAS Y REPARACI\xD3N
Las rupturas son frecuentes y no son un fracaso. Se presentan como retirada (silencios, respuestas breves) o confrontaci\xF3n (cr\xEDticas al terapeuta). Nombrarlas de forma no defensiva y explorarlas mejora el resultado.

ADHERENCIA A TAREAS
Las tareas entre sesiones duplican su cumplimiento cuando se dise\xF1an colaborativamente, se ensayan en sesi\xF3n, se anticipan obst\xE1culos y se revisan al inicio de la siguiente sesi\xF3n.`},{id:6,title:"C\xF3mo estructurar tu pr\xE1ctica privada",cat:"Pr\xE1ctica",desc:"Honorarios, agenda, captaci\xF3n y sostenibilidad.",time:"9 min",color:"#0176D3",content:`La sostenibilidad de una pr\xE1ctica privada depende de decisiones estructurales, no de voluntarismo.

HONORARIOS
Calcula tu tarifa desde el ingreso neto deseado, no desde el promedio del mercado: divide entre las sesiones realmente facturables al mes (considera 25-30 % de tiempo no facturable en notas, supervisi\xF3n y administraci\xF3n).

AGENDA
Define bloques fijos, reserva espacios de amortiguaci\xF3n y establece una pol\xEDtica de cancelaci\xF3n de 24 horas comunicada por escrito desde la primera sesi\xF3n. Las inasistencias no gestionadas son la principal fuga de ingreso.

CAPTACI\xD3N \xC9TICA
Las fuentes m\xE1s estables son la derivaci\xF3n entre colegas y la de pacientes dados de alta. El contenido psicoeducativo construye confianza; evita promesas de resultado, testimonios de pacientes y comparativos, prohibidos por los c\xF3digos \xE9ticos.

INDICADORES A VIGILAR
Ocupaci\xF3n de agenda, tasa de inasistencia, n\xFAmero de sesiones promedio por caso, ingreso por hora disponible y tasa de conversi\xF3n de primer contacto a primera cita.`}],su=[{id:"m1",name:"Recordatorio de cita",channel:"WhatsApp",body:"Hola {nombre}, te recuerdo tu sesi\xF3n del {fecha} a las {hora}. Si necesitas reagendar av\xEDsame con 24 h de anticipaci\xF3n. \u2014 {terapeuta}"},{id:"m2",name:"Confirmaci\xF3n de primera cita",channel:"WhatsApp",body:"Hola {nombre}, qued\xF3 confirmada tu primera sesi\xF3n el {fecha} a las {hora}. Te comparto la ubicaci\xF3n y el consentimiento informado para que lo revises antes. Cualquier duda, con confianza."},{id:"m3",name:"Seguimiento post-inasistencia",channel:"WhatsApp",body:"Hola {nombre}, not\xE9 que no pudimos vernos el {fecha}. \xBFTe gustar\xEDa reagendar? Tengo espacio esta semana."},{id:"m4",name:"Env\xEDo de tarea terap\xE9utica",channel:"Email",body:"Hola {nombre}, te comparto el ejercicio que acordamos en sesi\xF3n. La idea es practicarlo antes de vernos el {fecha}. Lo revisamos juntos al inicio de la pr\xF3xima sesi\xF3n."},{id:"m5",name:"Recordatorio de pago pendiente",channel:"Email",body:"Hola {nombre}, te comparto el estado de cuenta con el saldo pendiente de ${monto}. Puedes liquidarlo por transferencia o al inicio de la pr\xF3xima sesi\xF3n."},{id:"m6",name:"Encuesta de satisfacci\xF3n (NPS)",channel:"Email",body:"Hola {nombre}, en una escala de 0 a 10, \xBFqu\xE9 tan probable es que recomiendes mi consulta a alguien cercano? Tu respuesta me ayuda a mejorar el servicio."},{id:"m7",name:"Alta terap\xE9utica y seguimiento",channel:"Email",body:"Hola {nombre}, felicidades por el trabajo logrado. Como acordamos, agendamos una sesi\xF3n de seguimiento en 3 meses. Aqu\xED estoy si necesitas retomar antes."}],Si=["Referencia de colega","Referencia de paciente","Instagram","Google","Directorio profesional","Doctoralia","Aseguradora","Empresa / EAP","Otro"],fn=[{id:"nuevo",label:"Nuevo",color:"#94A3B8"},{id: <script>
  // Oculta el splash cuando React montó
  document.addEventListener('psytrack:ready', function () {
    const b = document.getElementById('boot');
    if (b) { b.classList.add('hide'); setTimeout(function () { b.remove(); }, 350); }
  });
  setTimeout(function () {
    const b = document.getElementById('boot');
    if (b) { b.classList.add('hide'); setTimeout(function () { b.remove(); }, 350); }
  }, 6000);

  // Oculta la píldora de estado tras unos segundos; reaparece si hay problema
  setTimeout(function () {
    const p = document.getElementById('cloudPill');
    if (p && !p.classList.contains('err') && !p.classList.contains('warn')) p.classList.remove('on');
  }, 6000);
